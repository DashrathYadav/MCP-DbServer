name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore MsDbServer/MsDbServer.csproj

      - name: Build
        run: dotnet build MsDbServer/MsDbServer.csproj --no-restore --configuration Release

      - name: Verify build
        run: |
          if [ -f "MsDbServer/bin/Release/net8.0/MsDbServer.dll" ]; then
            echo "✅ MCP Server built successfully"
          else
            echo "❌ Build failed"
            exit 1
          fi
